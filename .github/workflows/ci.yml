name: CI

# Skips doc-only changes and draft pull requests; marking a draft ready runs it.
on:
  push:
    branches: [main]
    paths-ignore: &skip
      - "*.md"
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *skip

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint, types and core tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  train:
    name: Training extras and smoke runs
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    needs: core
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run akili train --config configs/smoke.yaml
      - run: uv run akili train --config configs/dp-sgd.yaml
      - run: uv run akili simulate --config configs/federated-smoke.yaml
      # Quick audit: runs the attacks end to end; too small to pass, so report only.
      - run: >-
          uv run akili audit --quick --report-only
          --config configs/audit-no-dp.yaml --config configs/audit-dp-sgd.yaml
