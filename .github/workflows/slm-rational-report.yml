name: Phone language model (print a Light retrain report)
on:
  push:
    branches: [feat/slm-rational]
    paths: [.github/workflows/slm-rational-report.yml]
permissions:
  contents: read
  actions: read
jobs:
  print:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: report
          path: rep
          run-id: "45990072301"
          github-token: ${{ github.token }}
      - run: cat rep/report.md; for f in rep/r/eval-*.json; do python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1],d['metrics'])" "$f"; done; cat rep/r/rayo-*.json | head -c 600
