[project]
name = "akili"
version = "0.2.0"
description = "Pesa Clarity on-device transaction categoriser: synthetic data, DP training, federated client, TFLite export and privacy audits."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Pesa Clarity contributors" }]
dependencies = [
    "dp-accounting>=0.6.0,<0.7",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    # rayo's model converter, pinned to a rayo commit: the plain weights' graph (docs/WEIGHTS.md).
    # [tflite]: it reads the TFLite files the Keras models export (until they move to torch).
    # This commit is pesaclarity/rayo's feat/convert-onnx-int8 (int8 from float ONNX graphs);
    # the pin moves to rayo's main once that is merged.
    "rayo-convert[tflite] @ git+https://github.com/pesaclarity/rayo@054c8311619f60b38fed07c8042cf9564e36126f#subdirectory=convert",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.18,<2.22",
    "mlflow>=3.1,<4",
]
fl = [
    "flwr>=1.20,<2",
]
# PyTorch on CPU and onnx: the export path the models move to (decision 0023,
# akili.export.onnx). No TensorFlow.
torch = [
    "torch>=2.6,<2.16",
    "onnx>=1.17,<2",
]

[project.scripts]
akili = "akili.cli:main"

[project.urls]
Homepage = "https://github.com/pesaclarity/pesaclarity-ml"
Documentation = "https://github.com/pesaclarity/docs"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
# PyTorch's CPU wheels (no CUDA libraries), from PyTorch's own index.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
# rayo-convert comes from rayo's repository, by commit.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/akili"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL"]
# PLC0415: optional extras are imported lazily on purpose. PLR0912: the release gate is a flat checklist.
ignore = ["PLC0415", "PLR0912", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["akili"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tensorflow.*", "keras.*", "flwr.*", "mlflow.*", "dp_accounting.*", "torch.*", "onnx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tf.function is untyped; these modules wrap it deliberately.
module = ["akili.train.dp_sgd", "akili.federated.keras_trainer"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "tf: needs the [train] extra (TensorFlow)",
    "fl: needs the [fl] extra (Flower)",
    "torch: needs the [torch] extra (PyTorch, onnx)",
]
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:mlflow.*",
]
