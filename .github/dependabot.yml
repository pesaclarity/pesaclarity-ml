version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      ml:
        patterns: ["tensorflow*", "keras*", "mlflow*", "flwr*", "dp-accounting"]
      dev:
        patterns: ["ruff", "mypy", "pytest", "types-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
