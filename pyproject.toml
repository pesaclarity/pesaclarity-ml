[project]
name = "akili"
version = "0.3.0"
description = "Pesa Clarity on-device models: synthetic data, DP training, federated client, export to rayo's weights and privacy audits."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Pesa Clarity contributors" }]
dependencies = [
    "numpy>=1.26,<3",
    # opacus, the privacy accountant, is in the [torch] extra below: it needs torch, and the
    # core install stays without it.
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    # rayo's model converter, pinned to a rayo commit: the plain weights' graph (docs/WEIGHTS.md).
    # Without its [tflite] extra: no model here exports TFLite since decision 0023, stage 5.
    # This commit is pesaclarity/rayo's feat/convert-onnx-int8 (int8 from float ONNX graphs);
    # the pin moves to rayo's main once that is merged.
    "rayo-convert @ git+https://github.com/pesaclarity/rayo@054c8311619f60b38fed07c8042cf9564e36126f#subdirectory=convert",
]

[project.optional-dependencies]
fl = [
    "flwr>=1.20,<2",
]
# PyTorch on CPU, onnx, MLflow and Opacus: training and exporting every model
# (decision 0023, akili.export.onnx), and the privacy accountant (Meta, Apache-2.0): RDP for
# the gate, PRV for the tighter figure. Opacus needs torch, which comes from PyTorch's CPU
# index (tool.uv.sources below). No TensorFlow (removed in stage 5).
torch = [
    "torch>=2.6,<2.16",
    "opacus>=1.6,<1.7",
    "onnx>=1.17,<2",
    "mlflow>=3.1,<4",
]

[project.scripts]
akili = "akili.cli:main"

[project.urls]
Homepage = "https://github.com/pesaclarity/pesaclarity-ml"
Documentation = "https://github.com/pesaclarity/docs"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
# PyTorch's CPU wheels (no CUDA libraries), from PyTorch's own index.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
# rayo-convert comes from rayo's repository, by commit.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/akili"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL"]
# PLC0415: optional extras are imported lazily on purpose. PLR0912: the release gate is a flat checklist.
ignore = ["PLC0415", "PLR0912", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["akili"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "flwr.*",
    "mlflow.*",
    "torch.*",
    "onnx.*",
    "opacus.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fl: needs the [fl] extra (Flower)",
    "torch: needs the [torch] extra (PyTorch, Opacus, onnx and MLflow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
]
