name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint, types and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  train:
    name: Training extras and smoke runs
    runs-on: ubuntu-latest
    needs: core
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run akili train --config configs/smoke.yaml
      - run: uv run akili train --config configs/dp-sgd.yaml
      - run: uv run akili simulate --config configs/federated-smoke.yaml
