[project]
name = "akili"
version = "0.1.0"
description = "Pesa Clarity on-device transaction categoriser: synthetic data, DP training, federated client, TFLite export and privacy audits."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Pesa Clarity contributors" }]
dependencies = [
    "dp-accounting>=0.6.0,<0.7",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.18,<2.22",
    "mlflow>=3.1,<4",
]
fl = [
    "flwr>=1.20,<2",
]

[project.scripts]
akili = "akili.cli:main"

[project.urls]
Homepage = "https://github.com/pesaclarity/pesaclarity-ml"
Documentation = "https://github.com/pesaclarity/docs"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akili"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL"]
# PLC0415: optional extras are imported lazily on purpose. PLR0912: the release gate is a flat checklist.
ignore = ["PLC0415", "PLR0912", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["akili"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tensorflow.*", "keras.*", "flwr.*", "mlflow.*", "dp_accounting.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tf.function is untyped; these modules wrap it deliberately.
module = ["akili.train.dp_sgd", "akili.federated.keras_trainer"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "tf: needs the [train] extra (TensorFlow)",
    "fl: needs the [fl] extra (Flower)",
]
filterwarnings = [
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:mlflow.*",
]
