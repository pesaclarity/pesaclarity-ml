version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev # main takes only promotions from dev
    schedule:
      interval: weekly
    groups:
      ml:
        patterns: ["mlflow*", "flwr*", "opacus", "torch", "onnx"]
      dev:
        patterns: ["ruff", "mypy", "pytest", "types-*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev # main takes only promotions from dev
    schedule:
      interval: weekly
